# SeeWayWork 使用公司独立的发行身份；旧 OpenWork 标识只由迁移代码识别，
# 不再写入新安装包、协议注册或更新配置。
appId: com.foxwork.desktop
productName: SeeWayWork
copyright: "版权所有 © 2026 Fox"
protocols:
  - name: SeeWayWork
    schemes:
      - foxwork
directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
files:
  - electron/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - "!electron/**/*.test.*"
  - "!electron/**/*.spec.*"
  - "!server/**/*.test.*"
  - "!server/**/*.spec.*"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/*.test.*"
  - "!node_modules/**/*.spec.*"
  - package.json
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
      - "!*.test.js"
  - from: ../../packages/foxwork-docs
    to: foxwork-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
asarUnpack:
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSBluetoothAlwaysUsageDescription: SeeWayWork 仅在你主动使用蓝牙相关功能时访问蓝牙。
    NSBluetoothPeripheralUsageDescription: SeeWayWork 仅在你主动使用蓝牙相关功能时访问蓝牙。
    NSCameraUsageDescription: SeeWayWork 仅在你主动使用摄像头相关功能时访问摄像头。
    NSMicrophoneUsageDescription: SeeWayWork 仅在你主动开启语音模式时使用麦克风。
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - openwork-orchestrator
        - openwork-orchestrator-aarch64-apple-darwin
        - openwork-orchestrator-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "SeeWayWork Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/icon.png
  executableName: foxwork
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - openwork-orchestrator
        - openwork-orchestrator-aarch64-unknown-linux-gnu
        - openwork-orchestrator-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - openwork-orchestrator.exe
        - openwork-orchestrator-aarch64-pc-windows-msvc.exe
        - openwork-orchestrator-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.exe
        - versions.json-x86_64-pc-windows-msvc.exe
  target:
    - nsis
nsis:
  include: build/installer.nsh
artifactName: SeeWayWork-${os}-${arch}-${version}.${ext}
