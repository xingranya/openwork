# FoxWork 公司发行构建
#
# 产出 macOS arm64、macOS x64 和 Windows x64 三个平台的安装包，并汇总到
# 同一个 GitHub Release。当前仓库未配置 Apple 与 Windows 签名 Secret，
# 因此默认产出未签名的内部验收版本；配置签名 Secret 后自动进入签名流程。
name: FoxWork 发行构建

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布标签，例如 foxwork-v0.18.0；留空则只上传 Artifacts 不创建 Release
        required: false
        type: string
  push:
    tags:
      - foxwork-v*

permissions:
  contents: write

jobs:
  sync-cnb-tag:
    name: 同步发布标签到 CNB
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/foxwork-v') || inputs.release_tag != ''

    steps:
      - name: 检出完整仓库历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送同名标签到 CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN }}
          CNB_USER_NAME: xingranya
          CNB_REPOSITORY_URL: https://cnb.cool/xingranya/foxwork.git
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "未配置 GitHub Repository Secret：CNB_RELEASE_TOKEN" >&2
            exit 1
          fi
          echo "$RELEASE_TAG" | grep -Eq '^foxwork-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
          fi

          git config --global credential.helper 'cache --timeout=300'
          approve_credential() {
            printf 'protocol=https\nhost=cnb.cool\nusername=%s\npassword=%s\n\n' \
              "$CNB_USER_NAME" "$CNB_TOKEN" | git credential approve
          }
          reject_credential() {
            printf 'protocol=https\nhost=cnb.cool\nusername=%s\npassword=%s\n\n' \
              "$CNB_USER_NAME" "$CNB_TOKEN" | git credential reject || true
          }
          trap reject_credential EXIT
          approve_credential

          git push "$CNB_REPOSITORY_URL" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 及以上的 GitHub 托管 Runner 是 Apple Silicon
          - os: macos-14
            label: macOS arm64
            artifact: foxwork-mac-arm64
            target: aarch64-apple-darwin
            builder_args: --mac --arm64
          # macos-15-intel 是当前受支持的 Intel Runner。macos-13 已被 GitHub
          # 退役，指定它会导致作业永远排队且分配不到 Runner。
          - os: macos-15-intel
            label: macOS x64
            artifact: foxwork-mac-x64
            target: x86_64-apple-darwin
            builder_args: --mac --x64
          - os: windows-latest
            label: Windows x64
            artifact: foxwork-win-x64
            target: x86_64-pc-windows-msvc
            builder_args: --win --x64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # pnpm 必须在 setup-node 之前安装，否则 setup-node 找不到 pnpm 可执行文件
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建安装包
        # TARGET 决定 prepare-sidecar.mjs 下载哪个架构的 opencode 与
        # orchestrator 二进制，必须与 electron-builder 的目标架构一致，
        # 否则会打出架构不匹配的包。
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm --filter @openwork/desktop run build:electron && pnpm --filter @openwork/desktop exec electron-builder --config electron-builder.yml ${{ matrix.builder_args }} --publish never

      - name: 校验产物架构
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_DIR=$(find apps/desktop/dist-electron -maxdepth 1 -type d -name 'mac*' | head -1)
          BIN="$APP_DIR/FoxWork.app/Contents/MacOS/FoxWork"
          echo "主程序架构："
          file "$BIN"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) file "$BIN" | grep -q 'arm64' ;;
            x86_64-apple-darwin)  file "$BIN" | grep -q 'x86_64' ;;
          esac
          echo "Sidecar 架构："
          file "$APP_DIR/FoxWork.app/Contents/Resources/sidecars/opencode"

      - name: 生成 SHA-256 校验文件
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop/dist-electron
          rm -f SHA256SUMS.txt
          # Windows Runner 的 Git Bash 提供 sha256sum，macOS 提供 shasum
          if command -v sha256sum >/dev/null 2>&1; then
            hash_cmd="sha256sum"
          else
            hash_cmd="shasum -a 256"
          fi
          for f in *.dmg *.zip *.exe; do
            [ -e "$f" ] || continue
            $hash_cmd "$f" >> SHA256SUMS.txt
          done
          echo "本平台产物校验值："
          cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: 汇总到 GitHub Release
    needs:
      - sync-cnb-tag
      - build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/foxwork-v') || inputs.release_tag != ''

    steps:
      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物与校验文件
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} release/ \;
          cat artifacts/*/SHA256SUMS.txt > release/SHA256SUMS.txt
          echo "本次发布资产："
          ls -la release
          echo "校验值："
          cat release/SHA256SUMS.txt

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: FoxWork ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          files: release/*
          body: |
            ## FoxWork 内部验收版

            **本版本未签名，也未经 Apple 公证，只能用于公司内部验收，不得向员工正式分发。**

            当前仓库未配置 Apple Developer ID 与 Windows 代码签名 Secret，
            因此三个平台的安装包都是未签名产物。macOS 首次打开需要在
            「系统设置 - 隐私与安全性」中手动允许，Windows 会显示
            SmartScreen 提示。请不要为绕过提示而降低系统安全设置。

            ### 平台产物

            | 平台 | 文件 |
            |:---|:---|
            | macOS Apple Silicon | `foxwork-mac-arm64-*.dmg` |
            | macOS Intel | `foxwork-mac-x64-*.dmg` |
            | Windows x64 | `foxwork-win-x64-*.exe` |

            ### 校验方式

            `SHA256SUMS.txt` 包含全部产物的 SHA-256 校验值。

            macOS 与 Linux：

            ```bash
            shasum -a 256 -c SHA256SUMS.txt
            ```

            Windows PowerShell：

            ```powershell
            Get-FileHash .\foxwork-win-x64-0.18.0.exe -Algorithm SHA256
            ```

            ### 服务器要求

            FoxWork 需要公司自托管的 Den 控制面才能登录。部署方式见
            Brand Project OS 仓库的
            `deploy/phase3/foxwork-den/LINUX-DEPLOYMENT.md`。

            ### 许可证

            本项目基于 OpenWork 定制，其中 `ee/**` 采用 `FSL-1.1-MIT`，
            仅限公司内部使用和修改，必须保留许可证与版权声明。

      - name: 同步安装包到 CNB Release
        env:
          CNB_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN }}
          CNB_REPO_SLUG: xingranya/foxwork
          PLUGIN_TAG: ${{ inputs.release_tag || github.ref_name }}
          PLUGIN_ATTACHMENTS: ./release/*
          CNB_IS_TAG: "true"
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "未配置 GitHub Repository Secret：CNB_RELEASE_TOKEN" >&2
            exit 1
          fi

          docker run --rm \
            -e CNB_TOKEN \
            -e CNB_REPO_SLUG \
            -e PLUGIN_TAG \
            -e PLUGIN_ATTACHMENTS \
            -e CNB_IS_TAG \
            -e CNB_API_ENDPOINT=https://api.cnb.cool \
            -e CNB_WEB_ENDPOINT=https://cnb.cool \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            cnbcool/attachments:v1.1.3
