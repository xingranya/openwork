# SeeWayWork 公司发行构建
#
# 直接从 apps/desktop 产出包含完整运行时的 macOS DMG 和 Windows EXE，
# 不构建 apps/installer 二段式下载器。当前仓库未配置 Apple 与 Windows
# 签名 Secret，因此默认产出未签名的内部验收版本。
name: SeeWayWork 发行构建

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布标签，例如 seewaywork-v0.18.4；留空则只上传 Artifacts 不创建 Release
        required: false
        type: string
      build_platform:
        description: 手动验收时选择构建平台；仅 Windows 不创建 Release 或同步 CNB
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
  push:
    tags:
      - seewaywork-v*
      - foxwork-v* # 兼容旧版自动更新与回滚标签

permissions:
  contents: write

jobs:
  sync-cnb-tag:
    name: 同步发布标签到 CNB
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/seewaywork-v') ||
      startsWith(github.ref, 'refs/tags/foxwork-v') ||
      (inputs.release_tag != '' && inputs.build_platform != 'windows')

    steps:
      - name: 检出完整仓库历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送同名标签到 CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN }}
          CNB_USER_NAME: xingranya
          CNB_REPOSITORY_URL: https://cnb.cool/xingranya/foxwork.git
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "未配置 GitHub Repository Secret：CNB_RELEASE_TOKEN" >&2
            exit 1
          fi
          echo "$RELEASE_TAG" | grep -Eq '^(seewaywork|foxwork)-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
          fi

          git config --global credential.helper 'cache --timeout=300'
          approve_credential() {
            printf 'protocol=https\nhost=cnb.cool\nusername=%s\npassword=%s\n\n' \
              "$CNB_USER_NAME" "$CNB_TOKEN" | git credential approve
          }
          reject_credential() {
            printf 'protocol=https\nhost=cnb.cool\nusername=%s\npassword=%s\n\n' \
              "$CNB_USER_NAME" "$CNB_TOKEN" | git credential reject || true
          }
          trap reject_credential EXIT
          approve_credential

          git push "$CNB_REPOSITORY_URL" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            (github.event_name == 'workflow_dispatch' && inputs.build_platform == 'windows') &&
            '[{"os":"windows-latest","label":"Windows x64","artifact":"SeeWayWork-win-x64","target":"x86_64-pc-windows-msvc","builder_args":"--win nsis --x64","update_manifest":"latest.yml"}]' ||
            '[{"os":"macos-14","label":"macOS arm64","artifact":"SeeWayWork-mac-arm64","target":"aarch64-apple-darwin","builder_args":"--mac dmg zip --arm64","update_manifest":"latest-arm64-mac.yml"},{"os":"macos-15-intel","label":"macOS x64","artifact":"SeeWayWork-mac-x64","target":"x86_64-apple-darwin","builder_args":"--mac dmg zip --x64","update_manifest":"latest-x64-mac.yml"},{"os":"windows-latest","label":"Windows x64","artifact":"SeeWayWork-win-x64","target":"x86_64-pc-windows-msvc","builder_args":"--win nsis --x64","update_manifest":"latest.yml"}]'
          ) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 固定 pnpm 版本，确保三个平台使用同一套锁文件解析结果。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建完整桌面安装包
        # GitHub 的 Windows Runner 默认使用 PowerShell；这里包含 Bash 函数、
        # 数组和进程替换，必须显式使用 Git Bash，避免在构建前解析失败。
        shell: bash
        # TARGET 决定 prepare-sidecar.mjs 下载哪个架构的 opencode 与
        # orchestrator 二进制，必须与 electron-builder 的目标架构一致，
        # 否则会打出架构不匹配的包。
        env:
          TARGET: ${{ matrix.target }}
          FOXWORK_RELEASE_PAGE_URL: https://cnb.cool/xingranya/foxwork/-/releases
          FOXWORK_UPDATE_BASE_URL: https://cnb.cool/xingranya/foxwork/-/releases/download/seewaywork-stable
          VITE_FOXWORK_RELEASE_PAGE_URL: https://cnb.cool/xingranya/foxwork/-/releases
          VITE_FOXWORK_UPDATE_BASE_URL: https://cnb.cool/xingranya/foxwork/-/releases/download/seewaywork-stable
        run: |
          set -euo pipefail
          pnpm --filter @openwork/desktop run build:electron

          package_desktop() {
            pnpm --filter @openwork/desktop exec electron-builder \
              --config electron-builder.yml ${{ matrix.builder_args }} --publish never
          }

          if [ "${{ runner.os }}" != "macOS" ]; then
            package_desktop
            exit 0
          fi

          # Intel macOS Runner 偶尔会在 dmgbuild 卸载临时磁盘时返回
          # “Resource busy”。ZIP 已生成、应用也已签名，此时重试打包即可恢复，
          # 不应把一次 Runner 挂载抖动误判为应用构建失败。
          for attempt in 1 2 3; do
            if package_desktop; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "DMG 临时磁盘未能正常卸载，清理后重试（$attempt/3）。" >&2
            while IFS= read -r device; do
              hdiutil detach "$device" -force || true
            done < <(hdiutil info | awk '/^\/dev\/disk[0-9]+/ { print $1 }' | sort -u)
            sleep 10
          done

      - name: 验证桌面更新安装契约
        shell: bash
        run: pnpm --filter @openwork/desktop exec node --test electron/updater.test.mjs electron/foxwork-brand.test.mjs

      - name: 校验并整理自动更新附件
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop/dist-electron
          if [ "${{ runner.os }}" = "macOS" ]; then
            test -s latest-mac.yml
            mv latest-mac.yml "${{ matrix.update_manifest }}"
            update_packages=(SeeWayWork-mac-*-*.zip)
            if [ "${#update_packages[@]}" -ne 1 ] || [ ! -s "${update_packages[0]}.blockmap" ]; then
              echo "macOS 自动更新 ZIP 或 blockmap 不完整。" >&2
              exit 1
            fi
          else
            test -s latest.yml
            update_packages=(SeeWayWork-win-x64-*.exe)
            if [ "${#update_packages[@]}" -ne 1 ] || [ ! -s "${update_packages[0]}.blockmap" ]; then
              echo "Windows 自动更新 EXE 或 blockmap 不完整。" >&2
              exit 1
            fi
          fi
          test -s "${{ matrix.update_manifest }}"
          grep -Eq '^version: [0-9]+\.[0-9]+\.[0-9]+' "${{ matrix.update_manifest }}"
          echo "自动更新清单：${{ matrix.update_manifest }}"

      - name: 拒绝二段式下载器和异常小包
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop/dist-electron
          shopt -s nullglob
          if [ "${{ runner.os }}" = "Windows" ]; then
            packages=(SeeWayWork-win-x64-*.exe)
          else
            packages=(SeeWayWork-mac-*-*.dmg)
          fi
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "应当且只能生成一个当前平台的完整安装包，实际为 ${#packages[@]} 个。" >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi
          package_size=$(wc -c < "${packages[0]}" | tr -d ' ')
          minimum_size=$((100 * 1024 * 1024))
          if [ "$package_size" -lt "$minimum_size" ]; then
            echo "安装包只有 $package_size 字节，疑似二段式下载器或缺少运行时。" >&2
            exit 1
          fi
          echo "完整安装包：${packages[0]}（$package_size 字节）"

      - name: 校验产物架构
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_DIR=$(find apps/desktop/dist-electron -maxdepth 1 -type d -name 'mac*' | head -1)
          BIN="$APP_DIR/SeeWayWork.app/Contents/MacOS/SeeWayWork"
          echo "主程序架构："
          file "$BIN"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) file "$BIN" | grep -q 'arm64' ;;
            x86_64-apple-darwin)  file "$BIN" | grep -q 'x86_64' ;;
          esac
          echo "Sidecar 架构："
          file "$APP_DIR/SeeWayWork.app/Contents/Resources/sidecars/opencode"

      - name: 验证 Windows 完整安装与卸载
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Get-SeewayWorkUninstallEntry {
            # electron-builder 会按安装器内部的 sanitizedName 决定目录名，不能
            # 假定它始终等于产品展示名称。以 NSIS 写入的当前用户卸载项为准。
            $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "SeeWayWork*" } |
              Sort-Object DisplayVersion -Descending |
              Select-Object -First 1
            return $entry
          }

          function Wait-SeewayWorkUninstallEntry {
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              $entry = Get-SeewayWorkUninstallEntry
              if ($null -ne $entry) {
                return $entry
              }
              Start-Sleep -Milliseconds 250
            }
            throw "安装完成后未找到 SeeWayWork 卸载注册表项。"
          }

          function Get-UninstallExecutable([object]$entry) {
            $uninstallString = [string]$entry.UninstallString
            if ([string]::IsNullOrWhiteSpace($uninstallString)) {
              throw "SeeWayWork 卸载注册表项未提供 UninstallString。"
            }

            # NSIS 正常会为含空格的卸载程序路径加引号；无空格路径也保留兼容。
            $quoted = [regex]::Match($uninstallString, '^\s*"(?<path>[^"]+\.exe)"')
            $unquoted = [regex]::Match($uninstallString, '^\s*(?<path>\S+\.exe)')
            $uninstallerPath = if ($quoted.Success) {
              $quoted.Groups['path'].Value
            } elseif ($unquoted.Success) {
              $unquoted.Groups['path'].Value
            } else {
              throw "无法从 SeeWayWork UninstallString 解析卸载程序：$uninstallString"
            }

            if (-not (Test-Path $uninstallerPath)) {
              throw "卸载注册表项指向的程序不存在：$uninstallerPath"
            }
            return $uninstallerPath
          }

          $installer = Get-ChildItem "apps/desktop/dist-electron/SeeWayWork-win-x64-*.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "未找到 Windows 完整安装包。"
          }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Windows 安装包静默安装失败，退出码：$($install.ExitCode)"
          }

          $uninstallEntry = Wait-SeewayWorkUninstallEntry
          $uninstallerPath = Get-UninstallExecutable $uninstallEntry
          $installRoot = [string]$uninstallEntry.InstallLocation
          if ([string]::IsNullOrWhiteSpace($installRoot)) {
            $installRoot = Split-Path -Parent $uninstallerPath
          }
          if (-not (Test-Path $installRoot)) {
            throw "卸载注册表项指向的安装目录不存在：$installRoot"
          }

          $application = Join-Path $installRoot "SeeWayWork.exe"
          if (-not (Test-Path $application)) {
            throw "安装完成后未找到 SeeWayWork.exe：$application"
          }

          $uninstall = Start-Process -FilePath $uninstallerPath -ArgumentList "/S" -Wait -PassThru
          $remainingUninstallEntry = Get-SeewayWorkUninstallEntry
          if (
            $uninstall.ExitCode -ne 0 -or
            (Test-Path $application) -or
            (Test-Path $installRoot) -or
            $null -ne $remainingUninstallEntry
          ) {
            throw "Windows 安装包卸载失败，退出码：$($uninstall.ExitCode)"
          }

      - name: 生成 SHA-256 校验文件
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop/dist-electron
          rm -f SHA256SUMS.txt
          # Windows Runner 的 Git Bash 提供 sha256sum，macOS 提供 shasum
          if command -v sha256sum >/dev/null 2>&1; then
            hash_cmd="sha256sum"
          else
            hash_cmd="shasum -a 256"
          fi
          for f in *.dmg *.zip *.exe; do
            [ -e "$f" ] || continue
            $hash_cmd "$f" >> SHA256SUMS.txt
          done
          echo "本平台产物校验值："
          cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest*.yml
            apps/desktop/dist-electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: 汇总到 GitHub Release
    needs:
      - sync-cnb-tag
      - build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/seewaywork-v') ||
      startsWith(github.ref, 'refs/tags/foxwork-v') ||
      (inputs.release_tag != '' && inputs.build_platform != 'windows')

    steps:
      - name: 检出发布标签
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物与校验文件
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} release/ \;
          cat artifacts/*/SHA256SUMS.txt > release/SHA256SUMS.txt

          for required in latest-arm64-mac.yml latest-x64-mac.yml latest.yml; do
            if [ ! -s "release/$required" ]; then
              echo "缺少自动更新清单：$required" >&2
              exit 1
            fi
          done

          for pattern in \
            'SeeWayWork-mac-arm64-*.dmg' \
            'SeeWayWork-mac-arm64-*.zip' \
            'SeeWayWork-mac-x64-*.dmg' \
            'SeeWayWork-mac-x64-*.zip' \
            'SeeWayWork-win-x64-*.exe'; do
            matches=(release/$pattern)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]}" ]; then
              echo "发布附件不完整：$pattern" >&2
              exit 1
            fi
          done
          echo "本次发布资产："
          ls -la release
          echo "校验值："
          cat release/SHA256SUMS.txt

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: SeeWayWork ${{ inputs.release_tag || github.ref_name }}
          prerelease: false
          fail_on_unmatched_files: true
          files: release/*
          body: |
            ## SeeWayWork 内部验收版

            **本版本未签名，也未经 Apple 公证，只能用于公司内部验收，不得向员工正式分发。**

            本次只发布包含 SeeWayWork、OpenCode Runtime、Sidecar 和本机能力桥接的
            完整离线安装包，不包含二段式下载器。当前仓库未配置 Apple Developer ID
            与 Windows 代码签名 Secret，因此三个平台的安装包都是未签名产物。macOS 首次打开需要在
            「系统设置 - 隐私与安全性」中手动允许，Windows 会显示
            SmartScreen 提示。请不要为绕过提示而降低系统安全设置。

            ### 平台产物

            | 平台 | 文件 |
            |:---|:---|
            | macOS Apple Silicon | `SeeWayWork-mac-arm64-*.dmg` |
            | macOS Intel | `SeeWayWork-mac-x64-*.dmg` |
            | Windows x64 | `SeeWayWork-win-x64-*.exe` |

            `*.zip`、`*.blockmap`、`latest-arm64-mac.yml`、
            `latest-x64-mac.yml` 和 `latest.yml` 是应用内自动更新所需附件，
            员工无需手动下载。

            ### 校验方式

            `SHA256SUMS.txt` 包含全部产物的 SHA-256 校验值。

            macOS 与 Linux：

            ```bash
            shasum -a 256 -c SHA256SUMS.txt
            ```

            Windows PowerShell：

            ```powershell
            Get-FileHash .\SeeWayWork-win-x64-*.exe -Algorithm SHA256
            ```

            ### 服务器要求

            SeeWayWork 需要公司自托管的 Den 控制面才能登录。部署方式见
            Brand Project OS 仓库的
            `deploy/phase3/foxwork-den/LINUX-DEPLOYMENT.md`。

            ### 许可证

            本项目基于 OpenWork 定制，其中 `ee/**` 采用 `FSL-1.1-MIT`，
            仅限公司内部使用和修改，必须保留许可证与版权声明。

      - name: 同步安装包和自动更新清单到 CNB Release
        env:
          CNB_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN }}
          CNB_REPO_SLUG: xingranya/foxwork
          PLUGIN_TAG: ${{ inputs.release_tag || github.ref_name }}
          PLUGIN_ATTACHMENTS: ./release/*
          CNB_IS_TAG: "true"
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "未配置 GitHub Repository Secret：CNB_RELEASE_TOKEN" >&2
            exit 1
          fi

          # v1.1.3 上传完成后仍会输出已废弃且格式错误的 set-output 控制命令。
          # 只把该行转为普通日志；pipefail 继续保留容器真实失败状态。
          docker run --rm \
            -e CNB_TOKEN \
            -e CNB_REPO_SLUG \
            -e PLUGIN_TAG \
            -e PLUGIN_ATTACHMENTS \
            -e CNB_IS_TAG \
            -e CNB_API_ENDPOINT=https://api.cnb.cool \
            -e CNB_WEB_ENDPOINT=https://cnb.cool \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            cnbcool/attachments:v1.1.3 2>&1 \
            | sed 's/^##\[set-output /CNB 插件旧输出：/'

      - name: 推进 CNB 稳定更新通道
        if: startsWith(github.ref, 'refs/tags/seewaywork-v') || startsWith(inputs.release_tag, 'seewaywork-v')
        env:
          CNB_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN }}
          CNB_USER_NAME: xingranya
          CNB_REPOSITORY_URL: https://cnb.cool/xingranya/foxwork.git
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "未配置 GitHub Repository Secret：CNB_RELEASE_TOKEN" >&2
            exit 1
          fi
          echo "$RELEASE_TAG" | grep -Eq '^seewaywork-v[0-9]+\.[0-9]+\.[0-9]+$'

          git config --global credential.helper 'cache --timeout=300'
          approve_credential() {
            printf 'protocol=https\nhost=cnb.cool\nusername=%s\npassword=%s\n\n' \
              "$CNB_USER_NAME" "$CNB_TOKEN" | git credential approve
          }
          reject_credential() {
            printf 'protocol=https\nhost=cnb.cool\nusername=%s\npassword=%s\n\n' \
              "$CNB_USER_NAME" "$CNB_TOKEN" | git credential reject || true
          }
          trap reject_credential EXIT
          approve_credential

          # 每个 GitHub Actions 作业都有独立的工作目录；前面的同步作业创建的
          # 本地标签不会出现在这里。发布提交就是本次工作流的唯一权威来源。
          release_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          git tag --force seewaywork-stable "$release_commit"
          git push --force "$CNB_REPOSITORY_URL" \
            refs/tags/seewaywork-stable:refs/tags/seewaywork-stable

      - name: 等待 CNB 稳定更新通道就绪
        if: startsWith(github.ref, 'refs/tags/seewaywork-v') || startsWith(inputs.release_tag, 'seewaywork-v')
        env:
          CNB_STABLE_RELEASE_PAGE: https://cnb.cool/xingranya/foxwork/-/releases/tag/seewaywork-stable
        run: |
          set -euo pipefail
          # CNB 需要先调度一次仅创建 Release 的标签构建。遇到队列繁忙时，
          # 60 秒不足以等到稳定通道就绪，会让已经成功构建的安装包无法发布。
          for attempt in $(seq 1 120); do
            # CNB 的页面路由即使 Release 尚不存在也会返回 HTTP 200；必须读取
            # 服务端注入的 hasRelease 状态，不能只根据页面状态码继续上传。
            page=$(curl --fail --silent --show-error --location --max-time 10 \
              "$CNB_STABLE_RELEASE_PAGE" || true)
            if printf '%s' "$page" | grep -Fq '"hasRelease":true'; then
              echo "CNB 稳定更新通道已就绪。"
              exit 0
            fi
            sleep 5
          done
          echo "CNB 未能在 10 分钟内创建稳定更新通道 Release。" >&2
          exit 1

      - name: 同步稳定更新通道附件到 CNB
        if: startsWith(github.ref, 'refs/tags/seewaywork-v') || startsWith(inputs.release_tag, 'seewaywork-v')
        env:
          CNB_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN }}
          CNB_REPO_SLUG: xingranya/foxwork
          PLUGIN_TAG: seewaywork-stable
          PLUGIN_ATTACHMENTS: ./release/*
          CNB_IS_TAG: "true"
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "未配置 GitHub Repository Secret：CNB_RELEASE_TOKEN" >&2
            exit 1
          fi
          docker run --rm \
            -e CNB_TOKEN \
            -e CNB_REPO_SLUG \
            -e PLUGIN_TAG \
            -e PLUGIN_ATTACHMENTS \
            -e CNB_IS_TAG \
            -e CNB_API_ENDPOINT=https://api.cnb.cool \
            -e CNB_WEB_ENDPOINT=https://cnb.cool \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            cnbcool/attachments:v1.1.3 2>&1 \
            | sed 's/^##\[set-output /CNB 插件旧输出：/'

      - name: 验证 CNB 稳定更新清单
        if: startsWith(github.ref, 'refs/tags/seewaywork-v') || startsWith(inputs.release_tag, 'seewaywork-v')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          CNB_STABLE_UPDATE_URL: https://cnb.cool/xingranya/foxwork/-/releases/download/seewaywork-stable
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#seewaywork-v}"
          for manifest in latest-arm64-mac.yml latest-x64-mac.yml latest.yml; do
            content=$(curl --fail --silent --show-error --location --max-time 20 \
              "$CNB_STABLE_UPDATE_URL/$manifest")
            printf '%s\n' "$content" | grep -Fx "version: $expected_version"
            printf '%s\n' "$content" | grep -Eq '^path: SeeWayWork-.+\.(zip|exe)$'
          done
          echo "CNB 稳定更新清单已指向 $expected_version。"
