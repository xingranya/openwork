{{- if eq .Values.config.provisioner.mode "kubernetes" }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openwork-ee.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "den-api") | nindent 4 }}
automountServiceAccountToken: true
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openwork-ee.fullname" . }}-worker-provisioner
  namespace: {{ .Values.config.kubernetes.namespace }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "worker-provisioner") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "secrets", "services"]
    verbs: ["create", "delete", "get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["create", "delete", "get", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "delete", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openwork-ee.fullname" . }}-worker-provisioner
  namespace: {{ .Values.config.kubernetes.namespace }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "worker-provisioner") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openwork-ee.fullname" . }}-worker-provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "openwork-ee.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
